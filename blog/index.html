<style>
:root {
  --bg-top: #0d0b1f; --bg-bottom: #1a1035;
  --panel: rgba(148, 120, 255, 0.055);
  --edge: rgba(168, 85, 247, 0.22); --edge-bright: rgba(196, 130, 255, 0.45);
  --ink: #ece9f8; --ink-dim: #a89fc8; --ink-faint: #6f668f;
  --pink: #ff5e9a; --purple: #a855f7; --blue: #4f7cff;
  --grad: linear-gradient(93deg, var(--pink) 0%, var(--purple) 48%, var(--blue) 100%);
  --glow: 0 0 0 1px var(--edge), 0 8px 40px -12px rgba(168, 85, 247, 0.35);
  --radius: 18px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--sans); color: var(--ink); line-height: 1.65;
  background: linear-gradient(175deg, var(--bg-top) 0%, var(--bg-bottom) 100%) fixed;
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(600px 420px at 82% -6%, rgba(79,124,255,0.14), transparent 65%),
    radial-gradient(700px 480px at 8% 22%, rgba(255,94,154,0.09), transparent 65%);
}
.wrap { max-width: 860px; margin: 0 auto; padding: 0 22px; }
a { color: #c4b0ff; text-decoration: none; }
a:hover { color: #e0d4ff; }
header { display: flex; align-items: center; justify-content: space-between; padding: 22px 0 8px; }
.brand { font-family: var(--serif); font-size: 1.18rem; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 9px; }
.brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 12px rgba(168,85,247,0.8); }
nav.top { display: flex; gap: 26px; font-size: 0.93rem; }
nav.top a { color: var(--ink-dim); }
nav.top a:hover { color: var(--ink); }
.head { padding: 58px 0 34px; }
.head h1 {
  font-family: var(--serif); font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; line-height: 1.15;
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  padding-bottom: 4px;
}
.head p { color: var(--ink-dim); margin-top: 10px; max-width: 56ch; }
.posts { display: grid; gap: 18px; padding-bottom: 40px; }
.post-card {
  display: block;
  background: var(--panel); border: 1px solid var(--edge); border-radius: var(--radius);
  padding: 26px 26px 24px;
  transition: transform .22s ease, border-color .22s ease, box-shadow .25s ease;
}
.post-card:hover { transform: translateY(-3px); border-color: var(--edge-bright); box-shadow: var(--glow); }
.post-card .meta { font-size: 0.82rem; color: var(--ink-faint); margin-bottom: 8px; }
.post-card h2 { color: var(--ink); font-family: var(--serif); font-size: 1.35rem; margin-bottom: 8px; line-height: 1.3; }
.post-card p { color: var(--ink-dim); font-size: 0.95rem; }
.post-card .more { display: inline-block; margin-top: 14px; font-weight: 600; font-size: 0.9rem; color: #c4b0ff; }
.ad-slot {
  margin: 34px 0; min-height: 100px;
  display: flex; align-items: center; justify-content: center;
  border: 1px dashed rgba(168,85,247,0.16); border-radius: 12px;
  color: transparent; font-size: 0.75rem;
}
footer { border-top: 1px solid rgba(168,85,247,0.14); padding: 36px 0 46px; color: var(--ink-faint); font-size: 0.88rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/"><span class="dot"></span>FreeTubeTools</a>
    <nav class="top">
      <a href="/">Transcript tool</a>
      <a href="/blog/">Blog</a>
    </nav>
  </header>

  <div class="head">
    <h1>Read more</h1>
    <p>Practical guides on transcripts, content workflows, and squeezing real value out of free tools.</p>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════
       ADSENSE SLOT 1 — below page header.
       Paste your responsive AdSense unit code INSIDE this div.
       ═══════════════════════════════════════════════════════════════ -->
  <div class="ad-slot">ad slot 1</div>

  <!-- Post cards are rendered from the POSTS array in the script below -->
  <div class="posts" id="posts"></div>

  <!-- ═══════════════════════════════════════════════════════════════
       ADSENSE SLOT 2 — above footer.
       Paste your responsive AdSense unit code INSIDE this div.
       ═══════════════════════════════════════════════════════════════ -->
  <div class="ad-slot">ad slot 2</div>

  <footer>© <span id="year"></span> FreeTubeTools — free utilities, no catch.</footer>
</div>

<script>
'use strict';

/* ═══ ADD NEW BLOG POSTS HERE ═══════════════════════════════════════
   Two steps to publish a post:
     1. Copy an existing post HTML file in /blog/ and edit its content.
     2. Add one entry to this array (newest first). Done.               */
const POSTS = [
  {
    slug: 'turn-youtube-transcript-into-seo-article.html',
    title: 'How to Turn a YouTube Transcript into an SEO Article',
    description: "A transcript is a first draft hiding in plain sight. The exact workflow to turn one into a search-ranking article — cleaning, structuring, and optimizing it step by step.",
    date: '2026-07-05',
    displayDate: 'July 5, 2026',
    readTime: '6 min read',
    tag: 'Guide',
  },
];

// Render the blog index from the POSTS array
function renderPosts() {
  document.getElementById('posts').innerHTML = POSTS.map((p) => `
    <a class="post-card" href="/blog/${p.slug}">
      <div class="meta">${p.tag} · ${p.displayDate} · ${p.readTime}</div>
      <h2>${p.title}</h2>
      <p>${p.description}</p>
      <span class="more">Read the guide →</span>
    </a>`).join('');
}

renderPosts();
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
